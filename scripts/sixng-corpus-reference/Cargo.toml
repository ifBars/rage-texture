[package]
name = "sixng-corpus-reference"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Independent all-chunk RDS5/BCPack digest reference over pinned SixNG"

[dependencies]
sixng-core = { git = "https://github.com/holdmysocks/SixNG", rev = "7881042c294f3eeea1e8153e7bcafd84f9d787b9", default-features = false }
bcpack-rs = { git = "https://github.com/Ahmet-Dedeler/bcpack-rs", rev = "02a8c4e802800d55b55797a32dbfe8b16d7fc23f" }
flate2 = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
